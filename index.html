<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATM GK Planer | Asignación de Espacios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Metadatos PWA y Favicon -->
    <meta name="theme-color" content="#CB3524">
    <link rel="apple-touch-icon" href="GK-Planer.png">
    <link rel="icon" type="image/png" href="GK-Planer.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        atleti: {
                            red: '#CB3524',
                            blue: '#273246',
                            light: '#f8fafc',
                            gray: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f1f5f9; }
        
        .drag-over {
            background-color: #fee2e2 !important;
            border: 2px dashed #CB3524 !important;
        }

        .team-card {
            transition: all 0.2s ease;
            cursor: grab;
        }

        .team-card:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilos Realistas del Campo de Fútbol */
        .pitch-bg {
            background: repeating-linear-gradient(90deg, #4c962b, #4c962b 5.5%, #448924 5.5%, #448924 11%);
        }
        .pitch-line { 
            border-color: rgba(255, 255, 255, 0.75); 
        }
        .drop-target {
            background-color: rgba(255, 255, 255, 0.15) !important;
            border: 2px dashed white !important;
        }

        /* Ocultar botón de instalar si ya es PWA */
        @media all and (display-mode: standalone) {
            #install-app-btn { display: none !important; }
        }
        
        /* Prevenir scroll en móviles al intentar arrastrar */
        .touch-draggable { touch-action: none; user-select: none; -webkit-user-select: none; }
        
        /* Asegurar que las notificaciones salgan por encima de todo en móvil */
        #toast { z-index: 999999 !important; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden text-slate-800">

    <!-- Modal de Instalación PWA (Diseño Atleti) -->
    <div id="install-modal" class="fixed inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all border border-slate-100">
            <!-- Cabecera del modal -->
            <div class="bg-gradient-to-b from-atleti-blue to-slate-900 p-8 flex flex-col items-center justify-center text-center relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-atleti-red opacity-20 rounded-full -ml-10 -mb-10"></div>
                
                <img src="GK-Planer.png" alt="GK Planer Icon" class="w-24 h-24 rounded-2xl shadow-[0_10px_25px_rgba(0,0,0,0.5)] mb-5 object-cover bg-white relative z-10 border-2 border-white/20" onerror="this.src='ESCUDO%20ATM.png'">
                
                <h2 class="text-2xl font-bold text-white mb-1 relative z-10">GK Planer</h2>
                <p class="text-blue-200 text-xs font-semibold tracking-widest uppercase relative z-10">ATM GK Planer</p>
            </div>
            <!-- Cuerpo del modal -->
            <div class="p-7 text-center">
                <p class="text-slate-600 mb-7 text-sm leading-relaxed">
                    Instala esta aplicación en tu pantalla de inicio para un acceso instantáneo y experiencia a pantalla completa durante los entrenamientos.
                </p>
                <div class="flex flex-col space-y-3">
                    <button onclick="window.installPWA()" class="w-full bg-atleti-red hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-red-500/30 transition-all transform hover:-translate-y-0.5 flex justify-center items-center">
                        <i class="fa-solid fa-download mr-2"></i> Instalar Aplicación
                    </button>
                    <button onclick="window.closeInstallModal()" class="w-full bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-500 font-semibold py-3 px-4 rounded-xl transition-colors">
                        En otro momento
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CABECERA OPTIMIZADA PARA MÓVIL (ICONO CALENDARIO SIEMPRE VISIBLE) -->
    <header class="bg-atleti-red text-white shadow-md z-20 relative shrink-0">
        <div class="max-w-screen-2xl mx-auto px-3 md:px-4 h-14 md:h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 md:space-x-3 overflow-hidden w-full">
                <!-- ESCUDO EN LA CABECERA -->
                <div class="w-8 h-8 md:w-10 md:h-10 bg-white rounded-full flex items-center justify-center p-0.5 md:p-1 border-2 border-white/80 shadow-md shrink-0">
                    <img src="ESCUDO%20ATM.png" alt="ATM Logo" class="w-full h-full object-contain" onerror="this.src='https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg'">
                </div>
                <div class="truncate flex-1">
                    <h1 class="text-base md:text-xl font-bold tracking-wide truncate">ATM GK Planer</h1>
                    <p class="hidden md:block text-xs text-red-100 truncate">Áreas de Trabajo Específico</p>
                </div>
            </div>
            
            <div class="flex items-center shrink-0 ml-2">
                <!-- Selector de Fecha Clásico (Vuelve a ser visible como botón nativo) -->
                <div class="relative cursor-pointer flex items-center justify-center w-9 h-9 md:w-10 md:h-10 rounded-full bg-white/20 hover:bg-white/30 transition-colors shadow-sm border border-white/10">
                    <i class="fa-regular fa-calendar-alt text-base md:text-lg"></i>
                    <input type="date" id="current-date" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" title="Seleccionar fecha específica" />
                </div>
            </div>
        </div>
        
        <!-- Carrusel de Fechas Rápido -->
        <div class="bg-slate-900 border-t border-slate-700/50 h-12 md:h-14 flex items-center px-2 md:px-4 overflow-x-auto no-scrollbar shadow-inner" id="date-carousel">
            <!-- Los botones de fecha se inyectan aquí vía JS -->
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden bg-slate-800">
        
        <!-- Panel Izquierdo: Porteros a asignar (REDESIGN MÓVIL COMPACTO) -->
        <aside class="w-full md:w-80 bg-white shadow-md flex flex-col z-10 shrink-0 border-b border-slate-200 md:border-b-0 h-auto md:h-full">
            
            <!-- CONTENEDOR EQUIPOS HORIZONTAL (MÓVIL) / VERTICAL (DESKTOP) -->
            <div class="p-2 md:p-4 bg-slate-50 border-b border-slate-100 flex flex-col h-auto">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-atleti-blue text-[10px] md:text-sm uppercase tracking-wide"><i class="fa-solid fa-users mr-1"></i> Equipos / Zona</h2>
                    <span id="unassigned-count" class="bg-slate-200 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                
                <!-- SCROLL HORIZONTAL DE EQUIPOS EN MÓVIL -->
                <div class="flex flex-row md:flex-col overflow-x-auto md:overflow-y-auto no-scrollbar space-x-2 md:space-x-0 md:space-y-3 pb-1 md:pb-0 items-center md:items-stretch" id="unassigned-teams-container">
                    
                    <!-- HERRAMIENTA ZONA GK (Integrada en la lista en móvil para ahorrar espacio) -->
                    <div id="gk-marker" draggable="true" ondragstart="window.handleGKDragStart(event)" class="touch-draggable shrink-0 p-1.5 md:p-3 w-28 md:w-full rounded-lg border-2 border-atleti-red bg-red-50 text-atleti-red shadow-sm flex items-center justify-center cursor-grab transition-all border-dashed">
                        <i class="fa-solid fa-mitten text-sm md:text-lg mr-1.5"></i>
                        <span class="font-bold text-[10px] md:text-sm leading-tight text-center">Zona GK</span>
                    </div>

                    <!-- ZONA DONDE SE INYECTAN LOS EQUIPOS NO ASIGNADOS -->
                    <div id="unassigned-teams" class="flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-3 shrink-0" ondrop="window.handleDrop(event, 'unassigned')" ondragover="window.allowDrop(event)">
                        <!-- Tarjetas dinámicas -->
                    </div>
                </div>
            </div>

            <!-- CONTROLES COMPACTOS -->
            <div class="p-2 md:p-4 bg-white border-b border-slate-100 flex space-x-2 shrink-0">
                <button onclick="window.triggerAutoAssign()" class="flex-1 bg-atleti-blue hover:bg-slate-800 text-white text-[10px] md:text-xs font-semibold py-1.5 px-2 rounded shadow transition-colors flex justify-center items-center">
                    <i class="fa-solid fa-rotate mr-1"></i> Rotar
                </button>
                <button onclick="window.triggerClearAssignments()" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-600 text-[10px] md:text-xs font-semibold py-1.5 px-2 rounded shadow-sm transition-colors" title="Limpiar todo">
                    <i class="fa-solid fa-eraser"></i>
                </button>
                <button onclick="window.manualSave()" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-[10px] md:text-xs font-bold py-1.5 px-2 rounded shadow-md transition-colors flex justify-center items-center">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar
                </button>
                <button id="install-app-btn" onclick="window.forceInstallModal()" class="bg-slate-800 hover:bg-slate-900 text-white text-[10px] md:text-xs font-bold py-1.5 px-2.5 rounded shadow-md transition-colors flex justify-center items-center border border-slate-700" title="Instalar App">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>

            <!-- Añadir Campo Extra (Solo visible en desktop para no saturar) -->
            <div class="hidden md:block p-4 border-t border-slate-200 bg-slate-50 flex-1">
                <h2 class="font-bold text-atleti-blue text-xs uppercase tracking-wide mb-2"><i class="fa-solid fa-plus mr-2"></i>Añadir Campo (F7)</h2>
                <div class="flex space-x-2">
                    <input type="text" id="new-field-name" placeholder="Ej: Campo 4-1" class="flex-1 text-sm px-2 py-1.5 rounded border border-slate-300 focus:outline-none focus:border-atleti-red">
                    <button onclick="window.addCustomField()" class="bg-atleti-blue hover:bg-slate-800 text-white px-3 py-1.5 rounded transition-colors" title="Añadir Campo">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Matriz de Trabajo Específico (VISTA CAMPO) -->
        <section class="flex-1 flex flex-col overflow-hidden relative w-full">
            
            <div class="h-10 md:h-14 border-b border-slate-700 flex items-center px-3 md:px-6 justify-between bg-slate-900 shadow-sm z-10 shrink-0">
                <h3 class="text-[10px] md:text-lg font-semibold text-white truncate pr-2" id="display-date">Entrenamiento</h3>
                
                <!-- Selector de Horarios tipo Pestañas -->
                <div class="flex space-x-1 bg-slate-800 p-0.5 md:p-1 rounded-lg border border-slate-700 shrink-0" id="time-tabs">
                    <button onclick="window.setTimeSlot('s1')" id="tab-s1" class="px-2 md:px-5 py-1 text-[10px] md:text-sm font-semibold rounded bg-atleti-red text-white shadow-sm transition-all whitespace-nowrap">
                        17:45 - 19:15
                    </button>
                    <button onclick="window.setTimeSlot('s2')" id="tab-s2" class="px-2 md:px-5 py-1 text-[10px] md:text-sm font-semibold rounded text-slate-400 hover:text-white hover:bg-slate-700 transition-all whitespace-nowrap">
                        19:15 - 20:45
                    </button>
                </div>
            </div>

            <!-- Contenedor Visual de Campos -->
            <div class="flex-1 overflow-y-auto overflow-x-hidden p-3 md:p-8 no-scrollbar flex flex-col items-center space-y-6 md:space-y-10 relative pb-20" id="fields-container"></div>

            <!-- Notificación -->
            <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:right-6 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-2xl transform transition-transform translate-y-24 opacity-0 flex items-center space-x-3 pointer-events-none z-[999999] w-[90%] md:w-auto max-w-sm">
                <i class="fa-solid fa-circle-check text-green-400" id="toast-icon"></i>
                <span id="toast-message" class="text-xs md:text-sm font-medium">Guardado correctamente</span>
            </div>
        </section>
    </main>

    <!-- Script Principal (Módulo para Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // CONFIGURACIÓN Y DATOS BASE
        // ==========================================
        const TEAMS = [
            { id: 't1', name: 'Prebenjamín A' },
            { id: 't2', name: 'Benjamín B' },
            { id: 't3', name: 'Benjamín A' },
            { id: 't4', name: 'Alevín A' }
        ];

        const FIELDS = [
            { id: 'c3', name: 'Campo 3' },
            { id: 'c4', name: 'Campo 4' }
        ];

        const TIME_SLOTS = [
            { id: 's1', time: '17:45 - 19:15' },
            { id: 's2', time: '19:15 - 20:45' }
        ];

        let state = {
            date: new Date().toISOString().split('T')[0],
            activeSlot: 's1',
            assignments: {},   
            gkAssignments: {},
            customFields: [],
            savedDays: new Set()
        };

        let db, auth, appId;
        let unsubscribeSnapshot = null;
        let isOfflineMode = false;

        // ==========================================
        // MANEJO DE DATOS LOCALES (FALLBACK)
        // ==========================================
        function saveToLocalStorage(dateStr, data) {
            try {
                localStorage.setItem(`atm_gk_${dateStr}`, JSON.stringify(data));
            } catch(e) { console.warn("LocalStorage no disponible"); }
        }

        function loadFromLocalStorage(dateStr) {
            try {
                const localData = localStorage.getItem(`atm_gk_${dateStr}`);
                if (localData) {
                    const parsed = JSON.parse(localData);
                    state.assignments = parsed.data || {};
                    state.gkAssignments = parsed.gkData || {};
                    state.customFields = parsed.customFields || [];
                } else {
                    state.assignments = {};
                    state.gkAssignments = {};
                    state.customFields = [];
                }
            } catch(e) {
                state.assignments = {};
                state.gkAssignments = {};
                state.customFields = [];
            }
            renderApp();
        }

        // ==========================================
        // INICIALIZACIÓN DE FIREBASE E HÍBRIDO
        // ==========================================
        async function initFirebase() {
            try {
                let firebaseConfig;

                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    firebaseConfig = JSON.parse(__firebase_config);
                    appId = typeof __app_id !== 'undefined' ? __app_id : 'atletigk-local-app';
                } else {
                    firebaseConfig = {
                        apiKey: "AIzaSyDjq4rqhnuYt7I3PJoe_OuuZQo1G8L245I",
                        authDomain: "trivial-atm.firebaseapp.com",
                        projectId: "trivial-atm",
                        storageBucket: "trivial-atm.firebasestorage.app",
                        messagingSenderId: "461166180046",
                        appId: "1:461166180046:web:723989976e7084ae1f429f"
                    };
                    appId = 'atletigk-produccion';
                }
                
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                // Arrancamos escuchadores
                listenToDate(state.date);
                listenToSavedDays(); 

                // Intentar auth silenciosamente (No mostrar error si falla)
                try {
                    auth = getAuth(app);
                    await signInAnonymously(auth);
                } catch(authErr) {
                    console.warn("Auth silencioso ignorado por permisos.");
                }

            } catch (error) {
                console.error("Error conectando Firebase, pasando a Modo Local:", error);
                isOfflineMode = true;
                loadFromLocalStorage(state.date);
                listenToSavedDays(); 
            }
        }

        // ==========================================
        // LECTURA / ESCRITURA (NUBE + LOCAL)
        // ==========================================
        function listenToDate(dateStr) {
            if (!db || isOfflineMode) {
                loadFromLocalStorage(dateStr);
                return;
            }
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'assignments', dateStr);
            
            try {
                unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        state.assignments = docSnap.data().data || {};
                        state.gkAssignments = docSnap.data().gkData || {};
                        state.customFields = docSnap.data().customFields || [];
                        // Sincronizar local por si acaso
                        saveToLocalStorage(dateStr, docSnap.data());
                    } else {
                        state.assignments = {};
                        state.gkAssignments = {};
                        state.customFields = [];
                    }
                    renderApp();
                }, (error) => {
                    // Fallo silencioso, activamos el modo local sin molestar al usuario
                    isOfflineMode = true;
                    loadFromLocalStorage(dateStr);
                });
            } catch(e) {
                isOfflineMode = true;
                loadFromLocalStorage(dateStr);
            }
        }

        async function saveAssignments(manual = false) {
            const hasData = Object.keys(state.assignments).length > 0 || Object.keys(state.gkAssignments || {}).length > 0 || (state.customFields && state.customFields.length > 0);
            const dataToSave = { 
                data: state.assignments,
                gkData: state.gkAssignments || {},
                customFields: state.customFields || [],
                hasData: hasData 
            };

            // 1. Siempre guardar en local storage (Seguridad máxima)
            saveToLocalStorage(state.date, dataToSave);
            
            if (hasData) state.savedDays.add(state.date);
            else state.savedDays.delete(state.date);
            renderDateCarousel();

            // 2. Intentar guardar en Firebase
            if (!db || isOfflineMode) {
                if (manual) window.showToast('Guardado', 'success');
                return;
            }
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'assignments', state.date);
            try {
                await setDoc(docRef, dataToSave);
                if (manual) window.showToast('Planificación guardada');
            } catch (e) {
                isOfflineMode = true;
                if (manual) window.showToast("Guardado", "success");
            }
        }

        function listenToSavedDays() {
            // Cargar días desde localStorage primero
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('atm_gk_')) {
                    const dStr = key.replace('atm_gk_', '');
                    try {
                        const localData = JSON.parse(localStorage.getItem(key));
                        if (localData && localData.hasData) state.savedDays.add(dStr);
                    } catch(e) {}
                }
            }
            renderDateCarousel();

            // Sincronizar con Firebase si es posible
            if (!db || isOfflineMode) return;
            const today = new Date();
            for(let i = -7; i <= 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dStr = d.toISOString().split('T')[0];
                
                if(dStr !== state.date) { 
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'assignments', dStr);
                    getDoc(docRef).then(snap => {
                        if(snap.exists() && snap.data().hasData) {
                            state.savedDays.add(dStr);
                            renderDateCarousel(); 
                        }
                    }).catch(() => {}); // Fallo silencioso, ya lo tenemos local
                }
            }
        }

        window.manualSave = () => {
            saveAssignments(true);
        };

        // ==========================================
        // RENDERIZADO DE INTERFAZ
        // ==========================================
        function renderApp() {
            renderGrid();
            renderTeams();
        }

        function renderGrid() {
            const container = document.getElementById('fields-container');
            container.innerHTML = ''; 

            const allFields = [...FIELDS, ...(state.customFields || [])];

            allFields.forEach(field => {
                const isCustom = field.id.startsWith('c-ext-');
                const deleteBtn = isCustom ? `<button onclick="window.deleteCustomField('${field.id}')" class="ml-3 text-red-300 hover:text-red-500 transition-colors" title="Eliminar campo"><i class="fa-solid fa-trash"></i></button>` : '';

                const fieldHTML = `
                    <div class="w-full max-w-4xl flex flex-col items-center">
                        <h4 class="text-white font-bold mb-2 md:mb-3 flex items-center text-[11px] md:text-xl drop-shadow-md bg-slate-800/80 px-3 md:px-4 py-0.5 md:py-1 rounded-full border border-slate-600">
                            <i class="fa-solid fa-map-location-dot mr-1.5 md:mr-2 text-atleti-red"></i> ${field.name} ${deleteBtn}
                        </h4>
                        
                        <div class="relative w-full h-40 md:h-80 pitch-bg rounded-lg border-2 md:border-4 pitch-line shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex">
                            
                            <!-- DIBUJO DEL CAMPO EN PORCENTAJES (100% RESPONSIVE) -->
                            <div class="absolute inset-0 pointer-events-none opacity-80 z-0">
                                <div class="absolute top-0 bottom-0 left-1/2 w-0 pitch-line border-l-2 -translate-x-1/2"></div>
                                <div class="absolute top-1/2 left-1/2 w-[22%] aspect-square max-w-[140px] max-h-[140px] rounded-full pitch-line border-2 -translate-x-1/2 -translate-y-1/2"></div>
                                <div class="absolute top-1/2 left-1/2 w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-white -translate-x-1/2 -translate-y-1/2"></div>
                                
                                <div class="absolute top-1/2 left-0 w-[16%] h-[55%] pitch-line border-2 border-l-0 -translate-y-1/2"></div>
                                <div class="absolute top-1/2 left-0 w-[5%] h-[25%] pitch-line border-2 border-l-0 -translate-y-1/2"></div>
                                <div class="absolute top-1/2 left-[16%] w-[6%] h-[28%] pitch-line border-2 border-l-0 rounded-r-full -translate-y-1/2"></div>
                                
                                <div class="absolute top-1/2 right-0 w-[16%] h-[55%] pitch-line border-2 border-r-0 -translate-y-1/2"></div>
                                <div class="absolute top-1/2 right-0 w-[5%] h-[25%] pitch-line border-2 border-r-0 -translate-y-1/2"></div>
                                <div class="absolute top-1/2 right-[16%] w-[6%] h-[28%] pitch-line border-2 border-r-0 rounded-l-full -translate-y-1/2"></div>
                            </div>

                            <div class="w-1/2 h-full relative z-10 p-1 md:p-4 flex flex-col justify-center items-end" id="${field.id}-izq-container">
                                <div id="${field.id}-izq-gk-zone" class="absolute left-0 top-1/2 -translate-y-1/2 w-[40%] md:w-[35%] h-[75%] md:h-[65%] rounded-r-xl border-2 border-dashed border-transparent transition-all flex items-center justify-center overflow-visible z-20 hidden">
                                </div>
                                
                                <div id="${field.id}-izq" 
                                     class="w-[90%] md:w-[85%] h-full rounded-xl border-2 border-dashed border-transparent transition-all flex items-center justify-center relative overflow-hidden"
                                     ondrop="window.handleDrop(event, '${field.id}-izq')" 
                                     ondragover="window.allowDrop(event)"
                                     ondragenter="window.dragEnter(event)"
                                     ondragleave="window.dragLeave(event)">
                                     <span class="text-white/80 text-[8px] md:text-sm font-bold tracking-widest uppercase pointer-events-none bg-black/40 px-1.5 md:px-4 py-0.5 md:py-2 rounded-full backdrop-blur-sm z-0 text-center">Portería Izquierda</span>
                                </div>
                            </div>
                            <div class="w-1/2 h-full relative z-10 p-1 md:p-4 flex flex-col justify-center items-start" id="${field.id}-der-container">
                                <div id="${field.id}-der-gk-zone" class="absolute right-0 top-1/2 -translate-y-1/2 w-[40%] md:w-[35%] h-[75%] md:h-[65%] rounded-l-xl border-2 border-dashed border-transparent transition-all flex items-center justify-center overflow-visible z-20 hidden">
                                </div>
                                
                                <div id="${field.id}-der" 
                                     class="w-[90%] md:w-[85%] h-full rounded-xl border-2 border-dashed border-transparent transition-all flex items-center justify-center relative overflow-hidden"
                                     ondrop="window.handleDrop(event, '${field.id}-der')" 
                                     ondragover="window.allowDrop(event)"
                                     ondragenter="window.dragEnter(event)"
                                     ondragleave="window.dragLeave(event)">
                                     <span class="text-white/80 text-[8px] md:text-sm font-bold tracking-widest uppercase pointer-events-none bg-black/40 px-1.5 md:px-4 py-0.5 md:py-2 rounded-full backdrop-blur-sm z-0 text-center">Portería Derecha</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += fieldHTML;
            });
        }

        function renderTeams() {
            const unassignedContainer = document.getElementById('unassigned-teams');
            unassignedContainer.innerHTML = '';
            
            document.querySelectorAll('.pitch-bg div[id]').forEach(zone => {
                const teamCards = zone.querySelectorAll('.team-card-on-pitch');
                teamCards.forEach(card => card.remove());
                
                const span = zone.querySelector('span'); 
                if(span) span.style.display = 'block'; 
                
                zone.classList.remove('border-white/50', 'bg-black/30');
            });
            
            document.querySelectorAll('div[id$="-gk-zone"]').forEach(zone => {
                zone.classList.add('hidden');
                zone.classList.remove('ring-4', 'ring-atleti-red', 'ring-inset', 'bg-atleti-red/20');
                zone.innerHTML = ''; 
            });

            let unassignedCount = 0;

            TEAMS.forEach(team => {
                const card = document.createElement('div');
                card.id = `team-${team.id}`;
                card.draggable = true;
                card.ondragstart = window.handleDragStart;
                
                const activeSuffix = `-${state.activeSlot}`;
                const assignedKey = Object.keys(state.assignments).find(key => 
                    state.assignments[key] === team.id && key.endsWith(activeSuffix)
                );

                if (assignedKey) {
                    const spaceId = assignedKey.replace(activeSuffix, '');
                    const targetZone = document.getElementById(spaceId);
                    
                    if (targetZone) {
                        const span = targetZone.querySelector('span');
                        if(span) span.style.display = 'none';
                        
                        // Tarjeta en el campo (Diseño compacto en móvil)
                        card.className = `touch-draggable team-card-on-pitch w-[95%] md:w-[90%] max-w-[200px] p-1.5 md:p-4 rounded-xl border border-white/30 bg-atleti-blue/95 text-white shadow-[0_8px_15px_rgba(0,0,0,0.4)] backdrop-blur-sm flex flex-col md:flex-row items-center justify-center md:space-x-3 transform hover:scale-105 cursor-grab z-20 absolute`;
                        card.innerHTML = `
                            <div class="w-6 h-6 md:w-12 md:h-12 rounded-full bg-white flex items-center justify-center shadow-inner p-1 shrink-0">
                                <img src="ESCUDO%20ATM.png" alt="Atleti" class="w-full h-full object-contain drop-shadow-sm" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <i class="fa-solid fa-shield hidden text-[10px] md:text-xl text-atleti-blue drop-shadow-md"></i>
                            </div>
                            <p class="font-bold text-[9px] md:text-sm text-center md:text-left leading-tight drop-shadow-md tracking-wide mt-1 md:mt-0">${team.name}</p>
                        `;

                        targetZone.appendChild(card);
                        targetZone.classList.add('bg-black/20');
                    }
                } else {
                    // Tarjeta en lista NO asignada (Carrusel horizontal móvil)
                    card.className = `touch-draggable team-card p-1.5 md:p-3 w-28 md:w-full shrink-0 rounded-lg border border-slate-200 bg-white text-slate-700 shadow-sm flex flex-col md:flex-row items-center md:justify-between group hover:border-atleti-red/50 cursor-grab`;
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row items-center space-y-1 md:space-y-0 md:space-x-3 pointer-events-none w-full">
                            <div class="w-6 h-6 md:w-10 md:h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center group-hover:bg-red-50 transition-colors p-1 shrink-0">
                                <img src="ESCUDO%20ATM.png" alt="Atleti" class="w-full h-full object-contain drop-shadow-sm" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <i class="fa-solid fa-shield hidden text-atleti-blue text-[10px] md:text-base"></i>
                            </div>
                            <p class="font-bold text-[9px] md:text-sm leading-tight text-center md:text-left truncate w-full">${team.name}</p>
                        </div>
                        <i class="hidden md:block fa-solid fa-grip-vertical text-slate-300 group-hover:text-atleti-red pointer-events-none transition-colors shrink-0"></i>
                    `;
                    unassignedContainer.appendChild(card);
                    unassignedCount++;
                }
            });

            if (state.gkAssignments) {
                Object.keys(state.gkAssignments).forEach(key => {
                    if (key.endsWith(`-${state.activeSlot}`) && state.gkAssignments[key]) {
                        const spaceId = key.replace(`-${state.activeSlot}`, '');
                        const gkZoneId = `${spaceId}-gk-zone`;
                        const gkZone = document.getElementById(gkZoneId);
                        
                        if (gkZone) {
                            gkZone.classList.remove('hidden');
                            gkZone.classList.add('ring-4', 'ring-atleti-red', 'ring-inset', 'bg-atleti-red/20');
                            
                            const badge = createBadge(key);
                            gkZone.appendChild(badge);
                        }
                    }
                });
            }

            document.getElementById('unassigned-count').innerText = unassignedCount;
            
            window.attachTouchListeners();
        }

        function createBadge(key) {
            const badge = document.createElement('div');
            badge.className = 'gk-badge-overlay absolute -top-3 md:-top-4 left-1/2 -translate-x-1/2 bg-atleti-red text-white text-[9px] md:text-xs font-bold px-2 py-0.5 md:px-3 md:py-1.5 rounded-full shadow-lg z-[40] flex items-center cursor-pointer hover:bg-red-700 transition-colors border border-white/50 whitespace-nowrap';
            badge.innerHTML = '<i class="fa-solid fa-mitten mr-1 md:mr-2"></i> GK <i class="fa-solid fa-circle-xmark ml-1 md:ml-2 opacity-80 hover:opacity-100 text-[8px] md:text-xs"></i>';
            
            badge.onclick = (e) => {
                e.stopPropagation();
                delete state.gkAssignments[key];
                renderTeams();
                saveAssignments();
            };
            return badge;
        }

        // ==========================================
        // LÓGICA DE PESTAÑAS (HORARIOS)
        // ==========================================
        window.setTimeSlot = (slotId) => {
            state.activeSlot = slotId;
            
            TIME_SLOTS.forEach(slot => {
                const btn = document.getElementById(`tab-${slot.id}`);
                if(slot.id === slotId) {
                    btn.classList.add('bg-atleti-red', 'text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-700');
                } else {
                    btn.classList.remove('bg-atleti-red', 'text-white', 'shadow-sm');
                    btn.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-700');
                }
            });

            renderTeams(); 
        };

        // ==========================================
        // LÓGICA DRAG & DROP Y ACCIONES
        // ==========================================
        window.allowDrop = (ev) => ev.preventDefault();

        window.dragEnter = (ev) => {
            ev.preventDefault();
            const target = ev.target.closest('.pitch-bg div[id]');
            if (target) target.classList.add('drop-target');
        };

        window.dragLeave = (ev) => {
            const target = ev.target.closest('.pitch-bg div[id]');
            if (target) target.classList.remove('drop-target');
        };

        window.handleGKDragStart = (ev) => {
            ev.dataTransfer.setData("gkMarker", "true");
            ev.target.style.opacity = '0.4';
            ev.target.addEventListener('dragend', (e) => {
                e.target.style.opacity = '1';
                document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            }, {once: true});
        };

        window.handleDragStart = (ev) => {
            ev.dataTransfer.setData("teamId", ev.target.closest('div[id^="team-"]').id.replace('team-', ''));
            ev.target.style.opacity = '0.4';
            ev.target.addEventListener('dragend', (e) => {
                e.target.style.opacity = '1';
                document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            }, {once: true});
        };

        window.handleDrop = (ev, spaceId) => {
            ev.preventDefault();
            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            
            const fullKey = spaceId !== 'unassigned' ? `${spaceId}-${state.activeSlot}` : null;
            
            const isGkMarker = ev.dataTransfer.getData("gkMarker");
            if (isGkMarker === "true") {
                if (fullKey) {
                    if (!state.gkAssignments) state.gkAssignments = {};
                    state.gkAssignments[fullKey] = true;
                    renderTeams();
                    saveAssignments();
                }
                return;
            }

            const teamId = ev.dataTransfer.getData("teamId");
            if (!teamId) return;

            for (let key in state.assignments) {
                if (state.assignments[key] === teamId && key.endsWith(`-${state.activeSlot}`)) {
                    delete state.assignments[key];
                }
            }

            if (fullKey) {
                if (state.assignments[fullKey] && state.assignments[fullKey] !== teamId) {
                    window.showToast('Esta portería ya está ocupada', 'error');
                    return;
                }
                state.assignments[fullKey] = teamId;
            }

            renderTeams();
            saveAssignments();
        };

        // ==========================================
        // NUEVA LÓGICA: SOPORTE TÁCTIL (MÓVILES Y TABLETS) - OPTIMIZADO EXTREMO
        // ==========================================
        window.draggedItem = null;
        window.ghostEl = null;
        window.gkMarkerTouch = false;
        window.currentDropZone = null;
        window.touchOffsetX = 0;
        window.touchOffsetY = 0;

        window.attachTouchListeners = () => {
            document.querySelectorAll('.touch-draggable').forEach(el => {
                el.removeEventListener('touchstart', window.handleTouchStart);
                el.removeEventListener('touchmove', window.handleTouchMove);
                el.removeEventListener('touchend', window.handleTouchEnd);
                el.removeEventListener('touchcancel', window.handleTouchEnd);
                
                el.addEventListener('touchstart', window.handleTouchStart, { passive: false });
                el.addEventListener('touchmove', window.handleTouchMove, { passive: false });
                el.addEventListener('touchend', window.handleTouchEnd, { passive: false });
                el.addEventListener('touchcancel', window.handleTouchEnd, { passive: false });
            });
        };

        window.handleTouchStart = (ev) => {
            const target = ev.target.closest('.touch-draggable');
            if (!target) return;
            
            window.draggedItem = target;
            window.gkMarkerTouch = (target.id === 'gk-marker');
            window.currentDropZone = null;
            
            const touch = ev.touches[0];
            const rect = target.getBoundingClientRect();
            
            window.touchOffsetX = touch.clientX - rect.left;
            window.touchOffsetY = touch.clientY - rect.top;
            
            window.ghostEl = target.cloneNode(true);
            
            window.ghostEl.classList.remove('absolute', 'relative', 'transform', 'hover:scale-105');
            
            window.ghostEl.style.setProperty('position', 'fixed', 'important');
            window.ghostEl.style.setProperty('z-index', '999999', 'important');
            window.ghostEl.style.setProperty('opacity', '0.85', 'important');
            window.ghostEl.style.setProperty('pointer-events', 'none', 'important'); 
            window.ghostEl.style.setProperty('width', rect.width + 'px', 'important');
            window.ghostEl.style.setProperty('height', rect.height + 'px', 'important');
            window.ghostEl.style.setProperty('margin', '0', 'important');
            window.ghostEl.style.setProperty('left', '0px', 'important'); 
            window.ghostEl.style.setProperty('top', '0px', 'important');
            window.ghostEl.style.setProperty('transform-origin', 'top left', 'important');

            document.body.appendChild(window.ghostEl);

            window.moveGhost(touch.clientX, touch.clientY);
        };

        window.handleTouchMove = (ev) => {
            if (!window.ghostEl) return;
            if (ev.cancelable) ev.preventDefault(); 
            
            const touch = ev.touches[0];
            window.moveGhost(touch.clientX, touch.clientY);
            
            const dropTargetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropZone = dropTargetEl ? dropTargetEl.closest('.pitch-bg div[id]') : null;
            
            if (window.currentDropZone !== dropZone) {
                if (window.currentDropZone) window.currentDropZone.classList.remove('drop-target');
                if (dropZone) dropZone.classList.add('drop-target');
                window.currentDropZone = dropZone;
            }
        };

        window.handleTouchEnd = (ev) => {
            if (!window.draggedItem || !window.ghostEl) return;
            
            const touch = ev.changedTouches[0];
            window.ghostEl.remove();
            window.ghostEl = null;
            
            if (window.currentDropZone) {
                window.currentDropZone.classList.remove('drop-target');
                window.currentDropZone = null;
            }

            const dropTargetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropZone = dropTargetEl ? dropTargetEl.closest('.pitch-bg div[id]') : null;
            
            let spaceId = 'unassigned';
            if (dropZone) {
                spaceId = dropZone.id;
            } else if (dropTargetEl && (dropTargetEl.closest('#unassigned-teams') || dropTargetEl.closest('#unassigned-teams-container'))) {
                spaceId = 'unassigned';
            } else {
                 window.draggedItem = null;
                 window.gkMarkerTouch = false;
                 return; 
            }

            const mockEv = {
                preventDefault: () => {},
                dataTransfer: {
                    getData: (type) => {
                        if (type === 'gkMarker') return window.gkMarkerTouch ? "true" : null;
                        if (type === 'teamId' && !window.gkMarkerTouch) return window.draggedItem.id.replace('team-', '');
                        return null;
                    }
                }
            };
            
            window.handleDrop(mockEv, spaceId);
            
            window.draggedItem = null;
            window.gkMarkerTouch = false;
        };

        window.moveGhost = (x, y) => {
            if (!window.ghostEl) return;
            const posX = x - window.touchOffsetX;
            const posY = y - window.touchOffsetY;
            window.ghostEl.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
        };

        window.triggerAutoAssign = () => {
            state.assignments = {}; 
            state.gkAssignments = {}; 
            const dateObj = new Date(state.date);
            const dayOfYear = Math.floor((dateObj - new Date(dateObj.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            
            let teamIndex = dayOfYear % TEAMS.length;
            
            const allFields = [...FIELDS, ...(state.customFields || [])];
            const ALL_SPACES = [];
            allFields.forEach(f => {
                ALL_SPACES.push(`${f.id}-izq`);
                ALL_SPACES.push(`${f.id}-der`);
            });
            
            TIME_SLOTS.forEach(slot => {
                ALL_SPACES.forEach(spaceId => {
                    if (teamIndex < TEAMS.length) {
                        const team = TEAMS[teamIndex];
                        state.assignments[`${spaceId}-${slot.id}`] = team.id;
                        teamIndex++;
                    }
                });
                teamIndex = 0; 
            });

            renderTeams();
            saveAssignments();
        };

        window.triggerClearAssignments = () => {
            state.assignments = {};
            state.gkAssignments = {};
            renderTeams();
            saveAssignments();
            window.showToast('Asignaciones eliminadas');
        };

        // ==========================================
        // LÓGICA DE CAMPOS PERSONALIZADOS (F7)
        // ==========================================
        window.addCustomField = () => {
            const input = document.getElementById('new-field-name');
            const name = input.value.trim();
            if (!name) return;
            
            if (!state.customFields) state.customFields = [];
            state.customFields.push({ id: 'c-ext-' + Date.now(), name: name });
            
            input.value = '';
            renderApp();
            saveAssignments();
        };

        window.deleteCustomField = (id) => {
            if (!state.customFields) return;
            state.customFields = state.customFields.filter(f => f.id !== id);
            
            for (let key in state.assignments) {
                if (key.startsWith(id)) delete state.assignments[key];
            }
            for (let key in state.gkAssignments) {
                if (key.startsWith(id)) delete state.gkAssignments[key];
            }
            
            renderApp();
            saveAssignments();
        };

        // ==========================================
        // UI HELPERS & BOOTSTRAP
        // ==========================================
        window.showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            
            msgEl.innerText = msg;
            icon.className = type === 'error' 
                ? 'fa-solid fa-circle-exclamation text-red-400' 
                : 'fa-solid fa-circle-check text-green-400';

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        };

        function updateDisplayDateUI() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateObj = new Date(state.date);
            document.getElementById('display-date').innerText = "Planificación: " + dateObj.toLocaleDateString('es-ES', options);
            renderDateCarousel();
        }

        function renderDateCarousel() {
            const carousel = document.getElementById('date-carousel');
            carousel.innerHTML = '';
            
            const activeDate = new Date(state.date);
            
            const startDate = new Date(activeDate);
            startDate.setDate(activeDate.getDate() - 7);
            
            const esFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

            const todayStr = new Date().toISOString().split('T')[0];

            for (let i = 0; i < 15; i++) {
                const iterDate = new Date(startDate);
                iterDate.setDate(startDate.getDate() + i);
                const dateStr = iterDate.toISOString().split('T')[0];
                
                const isSelected = dateStr === state.date;
                const isToday = dateStr === todayStr;
                const hasData = state.savedDays.has(dateStr);

                let dateText = esFormatter.format(iterDate).replace('.', ''); 
                dateText = dateText.charAt(0).toUpperCase() + dateText.slice(1);
                if (isToday) dateText = "Hoy";

                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 md:px-4 py-1 md:py-1.5 mx-1 rounded-full text-[10px] md:text-sm font-medium transition-all flex items-center space-x-1.5 md:space-x-2 border 
                    ${isSelected 
                        ? 'bg-atleti-red text-white border-atleti-red shadow-md scale-105' 
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'}`;
                
                btn.onclick = () => {
                    document.getElementById('current-date').value = dateStr;
                    state.date = dateStr;
                    updateDisplayDateUI();
                    listenToDate(state.date);
                    
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };

                let indicator = '';
                if (hasData) {
                    indicator = `<span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.8)]"></span>`;
                }

                btn.innerHTML = `<span>${dateText}</span> ${indicator}`;
                carousel.appendChild(btn);
                
                if (isSelected) {
                    setTimeout(() => btn.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' }), 50);
                }
            }
        }

        const dateInput = document.getElementById('current-date');
        dateInput.value = state.date;
        updateDisplayDateUI();

        dateInput.addEventListener('change', (e) => {
            if(!e.target.value) return; 
            state.date = e.target.value;
            updateDisplayDateUI();
            listenToDate(state.date); 
        });

        // ==========================================
        // PWA E INSTALACIÓN 
        // ==========================================
        
        window.forceInstallModal = () => {
            document.getElementById('install-modal').classList.remove('hidden');
            document.getElementById('install-modal').classList.add('flex');
        };

        window.installPWA = async () => {
            alert("Para instalar la aplicación:\n\n📱 iOS (iPhone/iPad):\nToca el botón 'Compartir' (cuadrado con flecha hacia arriba) y selecciona 'Añadir a la pantalla de inicio'.\n\n🤖 Android (Chrome):\nToca el menú (3 puntos arriba a la derecha) y selecciona 'Añadir a la pantalla de inicio'.");
            window.closeInstallModal();
        };

        window.closeInstallModal = () => {
            document.getElementById('install-modal').classList.add('hidden');
            document.getElementById('install-modal').classList.remove('flex');
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
                const btn = document.getElementById('install-app-btn');
                if(btn) btn.style.display = 'none';
            }
        });

        initFirebase();

    </script>
</body>
</html>
